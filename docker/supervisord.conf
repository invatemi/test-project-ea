[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/supervisor-scheduler.log
stderr_logfile=/var/www/html/storage/logs/supervisor-scheduler-error.log

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=600
directory=/var/www/html
autostart=false
autorestart=true
stdout_logfile=/var/www/html/storage/logs/supervisor-queue.log
stderr_logfile=/var/www/html/storage/logs/supervisor-queue-error.log
